services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nature_bazar}
      POSTGRES_USER: ${POSTGRES_USER:-nature_bazar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nature_bazar}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-nature_bazar}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      PATHAO_BASE_URL: ${PATHAO_BASE_URL:-https://courier-api-sandbox.pathao.com}
      PATHAO_CLIENT_ID: ${PATHAO_CLIENT_ID:-}
      PATHAO_CLIENT_SECRET: ${PATHAO_CLIENT_SECRET:-}
      PATHAO_USERNAME: ${PATHAO_USERNAME:-}
      PATHAO_PASSWORD: ${PATHAO_PASSWORD:-}
      PATHAO_STORE_ID: ${PATHAO_STORE_ID:-0}
      PATHAO_UNIT_WEIGHT_KG: ${PATHAO_UNIT_WEIGHT_KG:-1}
      MEDIA_ROOT: /app/media
    volumes:
      # Uploaded product images. A named volume, not a bind or a path inside
      # the image: anything written into the container itself is lost the next
      # time the api image is rebuilt.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${META_PIXEL_ID:-}
        NEXT_PUBLIC_GTM_ID: ${GTM_ID:-}
    restart: unless-stopped
    environment:
      # Opens /legacy, the previous landing page, for a look. Runtime var:
      # `docker compose up -d --force-recreate web` after changing.
      SHOW_LEGACY_LANDING: ${SHOW_LEGACY_LANDING:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  media:
